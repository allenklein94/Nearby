<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A night out — Nearby</title>
<meta name="description" content="See the plan for the night, shared with you on Nearby — no app required.">
<style>
  /* Items 105 & 106 (CLAUDE.md): the same "plain static HTML + direct REST
     call with the public anon key" shape docs/invite.html already
     established for Gatherings (Item 72), extended to Occasion group
     plans -- a named guest can view the plan and RSVP with zero install,
     via a per-guest token instead of a plain object id. */
  :root {
    --background: #FFF8F3;
    --surface: #FFFFFF;
    --surface-elevated: #FFEEE2;
    --primary: #FF6B5B;
    --primary-muted: rgba(255, 107, 91, 0.12);
    --text-primary: #2D2420;
    --text-secondary: #6B5D54;
    --text-tertiary: #A69B92;
    --success: #4CAF7D;
    --border: #F0E0D4;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #14141f;
      --surface: #1e1e30;
      --surface-elevated: #262640;
      --primary: #ff4d6d;
      --primary-muted: rgba(255, 77, 109, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #a8a8c0;
      --text-tertiary: #6e6e8a;
      --success: #4ade80;
      --border: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--text-primary); text-decoration: none; margin-bottom: 20px; }
  .brand span { color: var(--primary); }
  .emoji { font-size: 44px; margin-bottom: 8px; }
  h1 { font-size: 21px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.2px; }
  .meta-line { font-size: 14px; color: var(--text-secondary); margin: 4px 0; }
  .status-badge {
    display: inline-block; margin-top: 12px; background: var(--surface-elevated);
    color: var(--text-secondary); font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: var(--radius-full);
  }
  .status-badge.joined { background: rgba(76, 175, 125, 0.15); color: var(--success); }
  .rsvp-row { display: flex; gap: 10px; margin-top: 22px; }
  .rsvp-button {
    flex: 1; font-weight: 700; font-size: 15px; border-radius: var(--radius-full);
    padding: 13px 10px; cursor: pointer; border: 1.5px solid var(--primary);
  }
  .rsvp-button.yes { background: var(--primary); color: #fff; border: none; }
  .rsvp-button.no { background: transparent; color: var(--primary); }
  .cta-button {
    display: block; width: 100%; background: var(--primary); color: #fff;
    font-weight: 700; font-size: 16px; border: none; border-radius: var(--radius-full);
    padding: 15px; cursor: pointer; margin-top: 24px; text-decoration: none;
  }
  .cta-button.secondary {
    background: transparent; color: var(--primary); border: 1.5px solid var(--primary);
    margin-top: 10px; padding: 13.5px;
  }
  .fine-print { margin-top: 14px; font-size: 12px; color: var(--text-tertiary); }
  .state-text { font-size: 15px; color: var(--text-secondary); padding: 20px 0; }
  #loaded, #not-found { display: none; }
  .stops { text-align: left; margin-top: 18px; }
  .stop { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .stop:first-child { border-top: none; }
  .stop-mark { width: 24px; color: var(--primary); font-weight: 800; }
  .stop-label { font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="nearbyBrandMarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0" stop-color="#FF5A5F" />
          <stop offset="1" stop-color="#FFA35C" />
        </linearGradient>
      </defs>
      <line x1="19.06" y1="39.55" x2="19.06" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <line x1="81.14" y1="39.55" x2="81.14" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <line x1="28.5" y1="39.55" x2="73.91" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <circle cx="19.26" cy="14.24" r="9.34" fill="url(#nearbyBrandMarkGradient)" />
      <circle cx="81.34" cy="14.24" r="9.24" fill="url(#nearbyBrandMarkGradient)" />
    </svg>
    Near<span>by</span>
  </a>

  <div id="loading" class="state-text">Loading the plan…</div>

  <div id="not-found">
    <div class="emoji">🙈</div>
    <h1>This link isn't available anymore</h1>
    <p class="meta-line">It may have expired or been turned off by whoever shared it.</p>
    <a class="cta-button" id="get-app-btn-notfound" href="#">Get Nearby</a>
  </div>

  <div id="loaded">
    <div class="emoji">✨</div>
    <h1 id="night-title">A night out</h1>
    <div class="meta-line" id="night-host"></div>
    <div class="status-badge" id="night-status"></div>
    <div class="stops" id="stops"></div>
    <p class="fine-print">You're viewing this plan. Only the person who shared it can change it.</p>
    <a class="cta-button secondary" id="get-app-btn">Get Nearby</a>
  </div>
</div>

<script>
  // Reads a plain ?t=<guest token> and renders get_public_shared_night (20270132_share_experience_night.sql): a VIEW-ONLY,
  // narrow projection (stop names + where each stands). No actions, no other plans, no people. Expired/turned-off = not found.
  var SUPABASE_URL = 'https://enmosvippabmuqslzrox.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_NU_9KSD7wft-FDSHclDHuw_6vsUDrZW';
  var IOS_STORE_URL = 'https://apps.apple.com/app/id6792143175';
  var ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.allenklein.nearby';
  var STATUS_LABEL = { draft: 'Planning', confirmed: 'Confirmed', completed: 'Done', cancelled: 'Cancelled' };
  var STATE_LABEL = { chosen: 'Not requested yet', requested: 'Waiting for the business', offer_received: 'Offer received', booked: "Booked", done: 'Done', cancelled: 'Cancelled' };

  function storeUrl() { return /Android/.test(navigator.userAgent) ? ANDROID_STORE_URL : IOS_STORE_URL; }
  var token = new URLSearchParams(window.location.search).get('t');
  var loadingEl = document.getElementById('loading');
  var notFoundEl = document.getElementById('not-found');
  var loadedEl = document.getElementById('loaded');
  document.getElementById('get-app-btn-notfound').href = storeUrl();
  document.getElementById('get-app-btn').href = storeUrl();

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function render(n) {
    document.getElementById('night-title').textContent = n.title || 'A night out';
    document.getElementById('night-host').textContent = n.hostDisplayName ? 'Shared by ' + n.hostDisplayName : '';
    document.getElementById('night-status').textContent = STATUS_LABEL[n.status] || '';
    var box = document.getElementById('stops');
    (n.stops || []).forEach(function (s) {
      var row = el('div', 'stop');
      row.appendChild(el('div', 'stop-mark', s.state === 'booked' || s.state === 'done' ? '✓' : String(s.order)));
      var col = el('div');
      col.appendChild(el('div', 'stop-label', s.componentLabel));
      var line = [s.title, s.subtitle && s.subtitle !== s.title ? s.subtitle : null].filter(Boolean).join(' · ');
      if (line) col.appendChild(el('div', 'meta-line', line));
      if (s.stopType === 'business_availability' && STATE_LABEL[s.state]) col.appendChild(el('div', 'meta-line', STATE_LABEL[s.state]));
      row.appendChild(col);
      box.appendChild(row);
    });
  }

  function fail() { loadingEl.style.display = 'none'; notFoundEl.style.display = 'block'; }

  if (!token) {
    fail();
  } else {
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_public_shared_night', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ token_param: token }),
    })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('request failed')); })
      .then(function (n) {
        if (!n) { fail(); return; }
        render(n);
        loadingEl.style.display = 'none';
        loadedEl.style.display = 'block';
      })
      .catch(fail);
  }
</script>
</body>
</html>
