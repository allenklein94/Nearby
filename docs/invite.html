<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited — Nearby</title>
<meta name="description" content="View this plan on Nearby — no app required.">
<style>
  /* Theme tokens translated directly from src/theme.js, same as business.html --
     Item 72 (CLAUDE.md): "Make invitations frictionless." This page lets anyone
     holding an invite link view the real plan with zero install, then offers a
     one-tap path into the full app. */
  :root {
    --background: #FFF8F3;
    --surface: #FFFFFF;
    --surface-elevated: #FFEEE2;
    --primary: #FF6B5B;
    --primary-muted: rgba(255, 107, 91, 0.12);
    --text-primary: #2D2420;
    --text-secondary: #6B5D54;
    --text-tertiary: #A69B92;
    --success: #4CAF7D;
    --border: #F0E0D4;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #14141f;
      --surface: #1e1e30;
      --surface-elevated: #262640;
      --primary: #ff4d6d;
      --primary-muted: rgba(255, 77, 109, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #a8a8c0;
      --text-tertiary: #6e6e8a;
      --success: #4ade80;
      --border: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--text-primary); text-decoration: none; margin-bottom: 20px; }
  .brand span { color: var(--primary); }
  .emoji { font-size: 44px; margin-bottom: 8px; }
  h1 { font-size: 21px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.2px; }
  .meta-line { font-size: 14px; color: var(--text-secondary); margin: 4px 0; }
  .attendee-badge {
    display: inline-block; margin-top: 12px; background: var(--surface-elevated);
    color: var(--text-secondary); font-size: 13px; font-weight: 600;
    padding: 6px 14px; border-radius: var(--radius-full);
  }
  .cta-button {
    display: block; width: 100%; background: var(--primary); color: #fff;
    font-weight: 700; font-size: 16px; border: none; border-radius: var(--radius-full);
    padding: 15px; cursor: pointer; margin-top: 24px; text-decoration: none;
  }
  .cta-button.secondary {
    background: transparent; color: var(--primary); border: 1.5px solid var(--primary);
    margin-top: 10px; padding: 13.5px;
  }
  .fine-print { margin-top: 14px; font-size: 12px; color: var(--text-tertiary); }
  .state-text { font-size: 15px; color: var(--text-secondary); padding: 20px 0; }
  #loaded, #not-found { display: none; }
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="index.html">
    <svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="nearbyBrandMarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0" stop-color="#FF5A5F" />
          <stop offset="1" stop-color="#FFA35C" />
        </linearGradient>
      </defs>
      <line x1="19.06" y1="39.55" x2="19.06" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <line x1="81.14" y1="39.55" x2="81.14" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <line x1="28.5" y1="39.55" x2="73.91" y2="84.96" stroke="url(#nearbyBrandMarkGradient)" stroke-width="20.09" stroke-linecap="round" />
      <circle cx="19.26" cy="14.24" r="9.34" fill="url(#nearbyBrandMarkGradient)" />
      <circle cx="81.34" cy="14.24" r="9.24" fill="url(#nearbyBrandMarkGradient)" />
    </svg>
    Near<span>by</span>
  </a>

  <div id="loading" class="state-text">Loading your invite…</div>

  <div id="not-found">
    <div class="emoji">🙈</div>
    <h1>This invite isn't available anymore</h1>
    <p class="meta-line">The plan may have been cancelled, or this link isn't valid.</p>
    <a class="cta-button" id="get-app-btn-notfound" href="#">Get Nearby</a>
  </div>

  <div id="loaded">
    <div class="emoji" id="preview-emoji">🎉</div>
    <h1 id="preview-title">You're invited!</h1>
    <div class="meta-line" id="preview-host"></div>
    <div class="meta-line" id="preview-when"></div>
    <div class="attendee-badge" id="preview-attendees" style="display:none;"></div>

    <button class="cta-button" id="open-app-btn">Open in Nearby</button>
    <a class="cta-button secondary" id="get-app-btn" href="#">Get Nearby</a>
    <p class="fine-print">See the exact time, place, and who's going — free, no account needed to preview, just to join.</p>
  </div>
</div>

<script>
  // Item 72 (CLAUDE.md): reads a plain ?g=<gathering id> query param and
  // renders a real, minimal preview via get_public_gathering_invite_preview
  // (20261030_public_gathering_invite_preview.sql) -- the same "plain static
  // HTML + direct REST call with the public anon key" shape docs/track.html
  // already established for Live Tracking's own signed-out viewer link.
  var SUPABASE_URL = 'https://enmosvippabmuqslzrox.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_NU_9KSD7wft-FDSHclDHuw_6vsUDrZW';
  var IOS_STORE_URL = 'https://apps.apple.com/app/id6792143175';
  var ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=com.allenklein.nearby';

  var CATEGORY_EMOJI = {
    Party: '🎉', Birthday: '🎂', Dinner: '🍽️', Foodie: '🍽️', Coffee: '☕',
    Drinks: '🍸', Music: '🎵', Fitness: '💪', Outdoors: '🏞️', Sports: '⚽',
    Games: '🎮', Arts: '🎨', Movies: '🎬', Travel: '✈️',
  };

  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent); }
  function isAndroid() { return /Android/.test(navigator.userAgent); }
  function isMobile() { return isIOS() || isAndroid(); }
  function storeUrl() { return isAndroid() ? ANDROID_STORE_URL : IOS_STORE_URL; }

  var params = new URLSearchParams(window.location.search);
  var gatheringId = params.get('g');

  var loadingEl = document.getElementById('loading');
  var notFoundEl = document.getElementById('not-found');
  var loadedEl = document.getElementById('loaded');

  document.getElementById('get-app-btn-notfound').href = storeUrl();
  document.getElementById('get-app-btn').href = storeUrl();

  document.getElementById('open-app-btn').addEventListener('click', function () {
    if (!gatheringId) return;
    if (!isMobile()) {
      // No native app to hand off to on desktop -- Get Nearby is the
      // honest next step there, not a surprise auto-redirect.
      window.location = storeUrl();
      return;
    }
    window.location = 'nearby://gathering/' + gatheringId;
    setTimeout(function () {
      // Still here (tab never backgrounded) after the deep link attempt --
      // the app almost certainly isn't installed. document.hidden is a
      // better signal than a raw elapsed-time race: if iOS/Android actually
      // switched to the native app, this tab goes into the background.
      if (!document.hidden) window.location = storeUrl();
    }, 1500);
  });

  if (!gatheringId) {
    loadingEl.style.display = 'none';
    notFoundEl.style.display = 'block';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/rpc/get_public_gathering_invite_preview', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ gathering_id_param: gatheringId }),
    })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (preview) {
        loadingEl.style.display = 'none';
        if (!preview) {
          notFoundEl.style.display = 'block';
          return;
        }
        renderPreview(preview);
        loadedEl.style.display = 'block';
      })
      .catch(function () {
        loadingEl.style.display = 'none';
        notFoundEl.style.display = 'block';
      });
  }

  function renderPreview(preview) {
    document.getElementById('preview-emoji').textContent = CATEGORY_EMOJI[preview.interest_tag] || '🎉';
    document.getElementById('preview-title').textContent = "You're invited to " + preview.title;
    document.getElementById('preview-host').textContent = preview.host_display_name
      ? 'Hosted by ' + preview.host_display_name
      : '';
    var when = preview.scheduled_at ? new Date(preview.scheduled_at) : null;
    document.getElementById('preview-when').textContent = when && !isNaN(when.getTime())
      ? when.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : '';
    var attendeesEl = document.getElementById('preview-attendees');
    if (preview.attendee_count > 0) {
      attendeesEl.textContent = preview.attendee_count === 1 ? '1 person going' : preview.attendee_count + ' people going';
      attendeesEl.style.display = 'inline-block';
    }
  }
</script>
</body>
</html>
